name: Temporary Formspree delivery test
on:
  push:
    paths:
      - '.github/workflows/formspree-smoke.yml'
permissions:
  contents: read
jobs:
  formspree-test:
    if: contains(github.event.head_commit.message, '[formspree-test-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send one unmistakable test memory and verify HTTP status
        env:
          FORM_ENDPOINT: https://formspree.io/f/mzerkrjb
          TEST_PAYLOAD: '{"message":"TEST SUBMISSION — Museum of Us, Day 01. This is a delivery check sent by ChatGPT on 2026-11-23. This is NOT her answer; no action needed.","day":"01","collection":"Museum of Us","question":"If you could keep one memory of us somewhere we could always return to, which one would you choose?","test_submission":"true"}'
        run: |
          set -euo pipefail
          echo 'Sending a single test message to the configured Formspree endpoint.'
          http_status=$(curl --location --silent --show-error --max-time 25 --output /tmp/formspree-response --write-out '%{http_code}' --request POST "$FORM_ENDPOINT" --header 'Accept: application/json' --header 'Content-Type: application/json' --data "$TEST_PAYLOAD")
          echo "Formspree HTTP status: $http_status"
          if [ "$http_status" != 200 ] && [ "$http_status" != 201 ] && [ "$http_status" != 202 ]; then
            echo 'Formspree did not accept the test submission.'
            sed -E 's/"[^" ]*(token|secret|api_key)[^" ]*":"[^"]*"/"[redacted]"/g' /tmp/formspree-response | head -c 1200
            exit 1
          fi
          echo 'TEST ACCEPTED. Confirm receipt in the Formspree inbox/dashboard.'
